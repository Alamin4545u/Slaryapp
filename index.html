<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ad Rewards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- ▼▼ Monetag: নিচের ২টি জায়গায় আপনার ZONE ID বসান (যেমন 1234567) ▼▼ -->
<script src="//libtl.com/sdk.js" data-zone="12308086" data-sdk="show_12308086"></script>
<style>
:root{
  --bg:#0b0a12; --surface:rgba(255,255,255,.05); --line:rgba(255,255,255,.10);
  --text:#f4f1ff; --muted:#9a96b5; --gold:#f5c76b; --violet:#8b5cf6; --mint:#4ade80;
  --font:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(60% 40% at 80% 0%,rgba(139,92,246,.35),transparent 70%),
    radial-gradient(50% 35% at 0% 100%,rgba(245,199,107,.18),transparent 70%),
    var(--bg);
  color:var(--text);font-family:var(--font);
  padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 20px);
  display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto;
}
header{display:flex;align-items:center;justify-content:space-between}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--violet));
  display:grid;place-items:center;font-weight:700;color:#14101f}
.user b{display:block;font-size:15px}.user span{font-size:12px;color:var(--muted)}
.pill{font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live .dot{background:var(--mint);box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 1.4s infinite}
.live{color:var(--mint)}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

.hero{
  border:1px solid var(--line);border-radius:28px;padding:30px 22px 26px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.hero small{color:var(--muted);font-size:13px}
.count{font-size:76px;font-weight:700;line-height:1.05;margin:6px 0 2px;
  background:linear-gradient(180deg,#fff3d0,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--muted)}

.ring{position:relative;height:6px;border-radius:9px;background:var(--line);margin:22px 4px 0;overflow:hidden}
.ring i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--violet),var(--gold));border-radius:9px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.seg button{border:0;border-radius:14px;padding:12px;font:600 14px var(--font);color:var(--muted);background:transparent;transition:.2s}
.seg button.on{background:rgba(139,92,246,.25);color:#fff;box-shadow:inset 0 0 0 1px rgba(139,92,246,.6)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px}
.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}

.cta{margin-top:auto;position:relative;border:0;border-radius:22px;padding:20px;font:700 18px var(--font);color:#1a1226;
  background:linear-gradient(135deg,#ffe3a3,var(--gold) 45%,#e8a93a);
  box-shadow:0 14px 40px -10px rgba(245,199,107,.6),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .15s,filter .2s}
.cta:active{transform:scale(.97)}
.cta.stop{background:linear-gradient(135deg,#ff9aa8,#f0506e);color:#fff;box-shadow:0 14px 40px -10px rgba(240,80,110,.6)}
.cta:disabled{filter:grayscale(.6) brightness(.8)}
.note{text-align:center;font-size:12px;color:var(--muted);min-height:16px}

.demo{position:fixed;inset:0;background:rgba(5,4,10,.92);display:none;place-items:center;z-index:9;text-align:center;padding:30px}
.demo.on{display:grid}.demo h2{font-size:22px;margin-bottom:6px}.demo p{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="user"><div class="avatar" id="av">U</div><div><b id="name">ইউজার</b><span id="uid">Telegram</span></div></div>
  <div class="pill" id="status"><i class="dot"></i><span>প্রস্তুত</span></div>
</header>

<section class="hero">
  <small>মোট দেখা বিজ্ঞাপন</small>
  <div class="count" id="count">0</div>
  <div class="sub" id="sub">নিচের বাটনে চাপ দিলে অ্যাড চলতে থাকবে</div>
  <div class="ring"><i id="bar"></i></div>
</section>

<div class="seg" role="group" aria-label="অ্যাডের বিরতি">
  <button data-s="2">প্রতি ২ সেকেন্ডে</button>
  <button data-s="5" class="on">প্রতি ৫ সেকেন্ডে</button>
</div>

<section class="stats">
  <div class="stat"><span>এই সেশনে</span><b id="sess">0</b></div>
  <div class="stat"><span>পরবর্তী অ্যাড</span><b id="next">—</b></div>
</section>

<p class="note" id="note"></p>
<button class="cta" id="cta">শো অ্যাড</button>

<div class="demo" id="demo"><div><h2>ডেমো অ্যাড</h2><p>Monetag SDK লোড হয়নি, তাই এটি পরীক্ষামূলক।<br>Zone ID বসালে আসল অ্যাড আসবে।</p></div></div>

<script>
const ZONE_ID = "12308086";          
const tg = window.Telegram && Telegram.WebApp;
if (tg){ tg.ready(); tg.expand(); try{tg.setHeaderColor("#0b0a12");tg.setBackgroundColor("#0b0a12");}catch(e){}
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u){ document.getElementById("name").textContent=u.first_name||"ইউজার";
    document.getElementById("uid").textContent="ID "+u.id;
    document.getElementById("av").textContent=(u.first_name||"U")[0].toUpperCase(); } }

const $=id=>document.getElementById(id);
let interval=5, running=false, total=+(localStorage.getItem("ads_total")||0), sess=0, timer=null, tick=null;
$("count").textContent=total;

const haptic=t=>{try{tg.HapticFeedback.impactOccurred(t||"light")}catch(e){}};
const setStatus=(txt,live)=>{ $("status").className="pill"+(live?" live":""); $("status").lastElementChild.textContent=txt; };

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); interval=+b.dataset.s; haptic(); });

function sdk(){ const f=window["show_"+ZONE_ID]; return typeof f==="function"?f:null; }

let fmt=0, inAppOn=false;
async function showOne(){
  const f=sdk();
  if(f){
    // Monetag এর সব ফরম্যাট ঘুরিয়ে ঘুরিয়ে চলবে: Rewarded Interstitial -> Rewarded Popup
    const kind=fmt++%2;
    if(kind===0) await f();
    else await f("pop");
  }else{ $("demo").classList.add("on"); await new Promise(r=>setTimeout(r,1200)); $("demo").classList.remove("on"); }
  total++; sess++; localStorage.setItem("ads_total",total);
  $("count").textContent=total; $("sess").textContent=sess; haptic("medium");
}

// In-App Interstitial (অটোমেটিক ব্যাকগ্রাউন্ড অ্যাড) - শো অ্যাড চাপলে একবার চালু হয়
function startInApp(){
  const f=sdk(); if(!f||inAppOn) return; inAppOn=true;
  try{ f({type:"inApp",inAppSettings:{frequency:3,capping:0.1,interval:30,timeout:5,everyPage:false}}); }catch(e){}
}

function countdown(ms){
  const end=Date.now()+ms; const bar=$("bar");
  clearInterval(tick);
  tick=setInterval(()=>{ const left=Math.max(0,end-Date.now());
    $("next").textContent=(left/1000).toFixed(1)+"s"; bar.style.width=(100-left/ms*100)+"%"; },100);
}

async function loop(){
  while(running){
    setStatus("অ্যাড চলছে",true); $("next").textContent="…";
    try{ await showOne(); $("note").textContent=""; }
    catch(e){ $("note").textContent="অ্যাড লোড হয়নি, আবার চেষ্টা করা হচ্ছে…"; }
    if(!running) break;
    setStatus("অপেক্ষা",true); countdown(interval*1000);
    await new Promise(r=>timer=setTimeout(r,interval*1000));
  }
}

$("cta").onclick=()=>{
  haptic("heavy");
  if(!running){ running=true; startInApp(); $("cta").textContent="বন্ধ করুন"; $("cta").classList.add("stop");
    $("sub").textContent="প্রতি "+interval+" সেকেন্ড পর পর অটো অ্যাড চলছে"; loop(); }
  else{ running=false; clearTimeout(timer); clearInterval(tick);
    $("cta").textContent="শো অ্যাড"; $("cta").classList.remove("stop");
    $("bar").style.width="0"; $("next").textContent="—"; setStatus("থেমে আছে",false);
    $("sub").textContent="নিচের বাটনে চাপ দিলে অ্যাড চলতে থাকবে"; }
};
</script>
</body>
</html>
