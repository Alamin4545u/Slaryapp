<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ওয়ান ট্যাপ</title>

<!-- ============================================================
     ধাপ ১: SDK লোড (এই দুটো লাইন যেমন আছে তেমনই থাকবে, বদলাবেন না)
     ============================================================ -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://ads.bengalads.com/sdk/telegram-interstitial.js"></script>

<style>
  :root{
    --bg:#101826; --card:#182236; --ink:#f3efe6; --muted:#8e9bb3;
    --accent:#f5b53d; --accent-ink:#2a1c00; --ok:#4fd1a1; --warn:#ff9b7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);
    user-select:none;-webkit-user-select:none;overflow:hidden;
  }
  header{text-align:center}
  h1{margin:0;font-size:22px;font-weight:700}
  .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
  .score{text-align:center}
  .score b{display:block;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
  .score span{color:var(--muted);font-size:14px}
  #tapBtn{
    width:210px;height:210px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);
    font:700 26px/1.2 inherit;font-family:inherit;
    box-shadow:0 0 0 10px rgba(245,181,61,.14),0 0 0 22px rgba(245,181,61,.07);
    transition:transform .08s ease;
  }
  #tapBtn:active{transform:scale(.94)}
  #tapBtn:disabled{opacity:.55}
  #tapBtn:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
  .progress{width:100%;max-width:320px}
  .bar{height:8px;background:var(--card);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s ease}
  #status{margin:10px 0 0;min-height:22px;text-align:center;font-size:14px;color:var(--muted)}
  #status.ok{color:var(--ok)} #status.warn{color:var(--warn)}
  @media (prefers-reduced-motion:reduce){#tapBtn,.bar i{transition:none}}
</style>
</head>
<body>

<header>
  <h1>ওয়ান ট্যাপ</h1>
  <p class="sub">বাটনে ট্যাপ করুন, পয়েন্ট জমান</p>
</header>

<div class="score">
  <b id="count">0</b>
  <span>মোট ট্যাপ</span>
</div>

<button id="tapBtn" type="button">ট্যাপ</button>

<div class="progress">
  <div class="bar"><i id="barFill"></i></div>
  <p id="status" role="status" aria-live="polite"></p>
</div>

<script>
/* ==================================================================
   ##########  ধাপ ২: এখানে আপনার BengalAds আইডি বসাবেন  ##########
   ------------------------------------------------------------------
   Publisher Dashboard → Telegram Mini Apps → My Mini Apps
     • App ID    (tma_...  দিয়ে শুরু) → নিচের APP_ID এ বসান
     • Format ID (int_...  দিয়ে শুরু) → নিচের FORMAT_ID এ বসান
   শুধু কোটেশনের ভেতরের লেখাটা বদলাবেন, আর কিছু নয়।
   ================================================================== */

var BENGALADS_APP_ID    = "tma_fec98fc694de96f690ac8933ab0e74cc89cb8d82";      // <-- আপনার App ID
var BENGALADS_FORMAT_ID = "int_f8d6d62c20ea66c9aeb935cb90081a5e10bc1cec";   // <-- আপনার Format ID

/* ------------------------------------------------------------------
   অ্যাপের সেটিং: কতটা ট্যাপ পরপর একটা বিজ্ঞাপন দেখাবে (ডিফল্ট ১০)
   ------------------------------------------------------------------ */
var TAPS_PER_AD = 10;

/* ================== এর নিচে কিছু বদলানোর দরকার নেই ================== */

(function () {
  var tg = window.Telegram && Telegram.WebApp;
  var countEl = document.getElementById("count");
  var btn = document.getElementById("tapBtn");
  var bar = document.getElementById("barFill");
  var statusEl = document.getElementById("status");

  var total = 0, sinceAd = 0, busy = false, adsReady = false, capped = false;

  function say(msg, cls) { statusEl.textContent = msg || ""; statusEl.className = cls || ""; }
  function render() {
    countEl.textContent = total;
    bar.style.width = Math.min(100, (sinceAd / TAPS_PER_AD) * 100) + "%";
  }
  function save() { try { localStorage.setItem("onetap_total", String(total)); } catch (e) {} }
  function load() {
    try { total = parseInt(localStorage.getItem("onetap_total"), 10) || 0; } catch (e) { total = 0; }
  }

  /* Telegram প্রস্তুত করা */
  if (tg) {
    tg.ready();
    try { tg.expand(); } catch (e) {}
  }

  /* BengalAds চালু করা (App ID + Format ID দিয়ে) */
  try {
    if (window.BengalAds && BENGALADS_APP_ID.indexOf("YOUR_") === -1 && BENGALADS_FORMAT_ID.indexOf("YOUR_") === -1) {
      BengalAds.init({
        appId: BENGALADS_APP_ID,
        formatId: BENGALADS_FORMAT_ID,
        telegramInitData: Telegram.WebApp.initData
      });
      adsReady = true;
    } else if (!window.BengalAds) {
      say("বিজ্ঞাপন SDK লোড হয়নি। ইন্টারনেট চেক করুন।", "warn");
    } else {
      say("App ID ও Format ID এখনো বসানো হয়নি।", "warn");
    }
  } catch (err) {
    console.error("BengalAds init error:", err);
    say("বিজ্ঞাপন চালু করা যায়নি।", "warn");
  }

  /* ইন্টারস্টিশিয়াল বিজ্ঞাপন দেখানো */
  async function showAd() {
    if (!adsReady || capped) return;
    busy = true; btn.disabled = true;
    say("বিজ্ঞাপন লোড হচ্ছে…");
    try {
      var result = await BengalAds.showInterstitial();
      if (result && result.status === "closed") {
        say("ধন্যবাদ! চালিয়ে যান।", "ok");
      } else if (result && result.status === "no_fill") {
        say("এখন কোনো বিজ্ঞাপন নেই, চালিয়ে যান।");
      } else if (result && result.status === "bot_daily_cap") {
        capped = true;
        say("আজকের বিজ্ঞাপনের সীমা শেষ।");
      } else {
        say("");
      }
    } catch (err) {
      console.error("BengalAds Error:", err);
      say("বিজ্ঞাপন দেখানো যায়নি।", "warn");
    }
    busy = false; btn.disabled = false;
  }

  /* ট্যাপ হ্যান্ডলার */
  btn.addEventListener("click", function () {
    if (busy) return;
    total++; sinceAd++;
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
    save(); render();
    if (sinceAd >= TAPS_PER_AD) {
      sinceAd = 0; render();
      showAd();
    }
  });

  load(); render();
})();
</script>
</body>
</html>
